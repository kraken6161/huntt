<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Ördek Avı">
<title>Ördek Avı — Prototip</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0d14; color: #e8eef7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: relative;
    width: 100%; max-width: 520px;
    height: 100vh; height: 100dvh;
    margin: 0 auto;
    background: #101827;
    box-shadow: 0 0 60px rgba(0,0,0,.6);
    overflow: hidden;
  }
  canvas#game { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---- debug panel ---- */
  #dbgToggle {
    position: absolute; top: 8px; right: 8px; z-index: 20;
    width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(10,14,22,.65); color: #cfe0f5;
    font-size: 18px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  #dbgToggle:active { transform: scale(.94); }
  #dbgPanel {
    position: absolute; top: 52px; right: 8px; z-index: 19;
    width: min(268px, calc(100% - 16px));
    max-height: calc(100% - 70px); overflow-y: auto;
    padding: 10px 12px 14px;
    background: rgba(9,13,20,.92);
    border: 1px solid rgba(255,255,255,.16); border-radius: 12px;
    font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    backdrop-filter: blur(6px);
    -webkit-overflow-scrolling: touch;
  }
  #dbgPanel[hidden] { display: none; }
  #dbgPanel h3 {
    margin: 0 0 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: #7fd4ff; font-weight: 700;
  }
  .dbg-stats {
    margin-bottom: 10px; padding: 6px 8px; border-radius: 8px;
    background: rgba(127,212,255,.08); color: #9fb6d0;
  }
  .dbg-stats span { color: #e8eef7; }
  .dbg-group {
    margin: 10px 0 4px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.1);
    color: #6f8098; letter-spacing: .1em; text-transform: uppercase; font-size: 9px;
  }
  .dbg-row { margin: 7px 0; }
  .dbg-row label {
    display: flex; justify-content: space-between; gap: 8px;
    color: #b9c9dd; margin-bottom: 3px;
  }
  .dbg-row label b { color: #ffd166; font-weight: 600; }
  .dbg-row input[type=range] {
    width: 100%; height: 20px; margin: 0; accent-color: #7fd4ff; background: transparent;
  }
  .dbg-btns { display: flex; gap: 6px; margin-top: 12px; }
  .dbg-btns button {
    flex: 1; padding: 7px 4px; border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07);
    color: #dbe7f5; font: inherit;
  }
  .dbg-btns button:active { background: rgba(255,255,255,.16); }

  /* ---- telemetri ---- */
  #teleBar {
    position: absolute; left: 8px; bottom: 8px; z-index: 18;
    display: flex; gap: 6px; align-items: center;
    font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #teleBar button {
    padding: 7px 9px; border-radius: 9px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.22); background: rgba(10,14,22,.7);
    color: #cfe0f5; font: inherit; backdrop-filter: blur(4px);
  }
  #teleBar button:active { background: rgba(255,255,255,.16); }
  #teleBar b { color: #ffd166; font-weight: 700; }
  #teleToast {
    position: absolute; left: 50%; bottom: 54px; transform: translateX(-50%);
    z-index: 22; max-width: calc(100% - 24px);
    padding: 9px 13px; border-radius: 10px; text-align: center;
    background: rgba(9,13,20,.94); border: 1px solid rgba(255,255,255,.2);
    color: #dbe7f5; font: 11px/1.35 ui-monospace, Menlo, monospace;
    opacity: 0; transition: opacity .18s; pointer-events: none;
  }
  #teleToast.show { opacity: 1; }
  #teleModal {
    position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column;
    gap: 8px; padding: 14px; background: rgba(6,10,18,.95);
  }
  #teleModal[hidden] { display: none; }
  #teleModal p { margin: 0; font: 11px/1.4 ui-monospace, Menlo, monospace; color: #b9c9dd; }
  #teleModal textarea {
    flex: 1; width: 100%; resize: none; border-radius: 8px; padding: 8px;
    background: #0d1420; color: #cfe0f5; border: 1px solid rgba(255,255,255,.2);
    font: 10px/1.3 ui-monospace, Menlo, monospace;
  }
  #teleModal button {
    padding: 9px; border-radius: 9px; cursor: pointer; font: inherit;
    border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08); color: #dbe7f5;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <button id="dbgToggle" aria-label="Debug paneli">⚙</button>
  <div id="dbgPanel" hidden></div>
  <div id="teleBar">
    <button id="teleExport" title="Telemetriyi panoya kopyala ve indir">⬇ Export <b id="teleCount">0</b></button>
    <button id="teleClear" title="Kayıtlı telemetriyi sil">🗑</button>
  </div>
  <div id="teleToast"></div>
  <div id="teleModal" hidden>
    <p>Panoya kopyalanamadı — metni seçip elle kopyalayabilirsin.</p>
    <textarea id="teleJson" readonly></textarea>
    <button id="teleModalClose">Kapat</button>
  </div>
</div>

<script>
"use strict";

/* =========================================================================
   CONFIG — tüm ayarlanabilir sayılar burada (DESIGN.md: "Tüm sayılar
   CONFIG'de ve debug slider'ında"). Debug paneli bu objeyi canlı değiştirir.
   ========================================================================= */
const CONFIG = {
  duck: {

    speedJitter:    0.25,  // ördek başına hız rastgeleliği (0..1 oranı)

    firstDelay:     450,   // tur başındaki ilk gecikme (ms)
    minInterval:    220,   // zorluk artsa da inilebilecek en düşük süre (ms)
    maxAlive:       4      // ekranda aynı anda en fazla kaç ördek
  },
  ammo: {
    poolSize:       15,    // tur boyunca ortak mermi havuzu
    refundOnHit:    1,     // isabette geri gelen mermi (atış maliyeti hep 1 → net 0)
    missCost:       2,     // ıskanın toplam mermi maliyeti
    escapeCost:     1,     // kaçan ördeğin mermi maliyeti
    missReloadDelay: 0.45, // ıskadan sonra ateş edilemeyen süre (sn) — tek etki zaman
    poolGrowthPerRound: 2, // her turda havuza eklenen mermi
    lowWarning:     3,     // bu değerin altında görsel uyarı

  },
  round: {
    goal:           10,    // 1. turda düşürülmesi gereken ördek
    goalGrowth:     3,     // her turda hedefe eklenen
    endDelay:       700,   // tur/run bitişinde bekleme (ms)
    breakDuration:  3000   // tur arası özet ekranı süresi (ms)
  },
  combo: {
    step:           0.5,   // her ardışık isabette çarpana eklenen kademe
    max:            5.0,   // maksimum çarpan
    decayTime:      2.0,   // ateş edilmezse bir kademe inme süresi (sn)
    warnTime:       0.5    // düşmeye kaç sn kala uyarı
  },
  score: {
    perDuck:        100    // ördek başına temel puan (çarpanla çarpılır)
  },
  difficulty: {
    speedGrowth:    0.12,  // tur başına hız artışı
    spawnGrowth:    0.08,  // tur başına spawn aralığının kısalması
    sizeShrink:     0.05   // tur başına ördek boyutunun küçülmesi
  },
  /* Atış kalitesi modeli — denge sayısı değil, telemetri/analiz için.
     sim.js de bu değerleri okur; p = skill × ölçek^sizeExp ×
     (temel hız/hız)^speedExp × (1 − centerPenalty × merkeze uzaklık) */
  model: {
    skill:          1.03,   // gerçek telemetriden kalibre edildi (isabet/Σq = 1.028)
    sizeExp:        0.80,
    speedExp:       0.60,
    centerPenalty:  0.35
  }
};

const GAME_VERSION = "0.4.0";   // telemetri dosyalarına yazılır, elle artır

/* Debug panelindeki slider'lar */
const SLIDERS = [
  { group: "Mermi ekonomisi" },
  { path: "ammo.poolSize",           label: "Havuz boyutu",        min: 1,   max: 40,   step: 1 },
  { path: "ammo.refundOnHit",        label: "İsabette geri gelen", min: 0,   max: 3,    step: 1 },

  { path: "ammo.escapeCost",         label: "Kaçış maliyeti",      min: 0,   max: 5,    step: 1 },
  { path: "ammo.missReloadDelay",    label: "Iska dolum gecik. (sn)", min: 0, max: 2,    step: 0.05 },
  { path: "ammo.poolGrowthPerRound", label: "Tur başına havuz +",  min: 0,   max: 10,   step: 1 },
  { path: "ammo.lowWarning",         label: "Uyarı eşiği",         min: 0,   max: 10,   step: 1 },
  { path: "ammo.refillEachRound",    label: "Her tur dolsun (0/1)",min: 0,   max: 1,    step: 1 },
  { group: "Tur" },
  { path: "round.goal",              label: "Tur hedefi",          min: 1,   max: 40,   step: 1 },
  { path: "round.goalGrowth",        label: "Hedef artışı",        min: 0,   max: 10,   step: 1 },
  { group: "Kombo & Skor" },
  { path: "combo.step",              label: "Kademe artışı",       min: 0.1, max: 2,    step: 0.1 },
  { path: "combo.max",               label: "Maksimum çarpan",     min: 1,   max: 15,   step: 0.5 },
  { path: "combo.decayTime",         label: "Düşme süresi (sn)",   min: 0.4, max: 8,    step: 0.1 },
  { path: "combo.warnTime",          label: "Uyarı süresi (sn)",   min: 0.1, max: 3,    step: 0.1 },
  { path: "score.perDuck",           label: "Ördek puanı",         min: 10,  max: 1000, step: 10 },
  { group: "Ördek" },
  { path: "duck.speed",              label: "Hız (px/sn)",         min: 40,  max: 600,  step: 5 },
  { path: "duck.speedJitter",        label: "Hız rastgeleliği",    min: 0,   max: 1,    step: 0.05 },
  { path: "duck.width",              label: "Genişlik",            min: 20,  max: 140,  step: 2 },
  { path: "duck.height",             label: "Yükseklik",           min: 12,  max: 100,  step: 2 },
  { path: "duck.waveAmplitude",      label: "Sinüs genliği",       min: 0,   max: 220,  step: 2 },
  { path: "duck.waveFrequency",      label: "Sinüs frekansı (Hz)", min: 0,   max: 3,    step: 0.05 },
  { path: "duck.hitPadding",         label: "İsabet toleransı",    min: 0,   max: 60,   step: 1 },
  { path: "duck.minScale",           label: "En küçük boyut",      min: 0.2, max: 1,    step: 0.05 },
  { group: "Spawn" },
  { path: "spawn.interval",          label: "Aralık (ms)",         min: 150, max: 3000, step: 25 },
  { path: "spawn.intervalJitter",    label: "Aralık rastgeleliği", min: 0,   max: 1,    step: 0.05 },
  { path: "spawn.maxAlive",          label: "Aynı anda ördek",     min: 1,   max: 10,   step: 1 },
  { group: "Zorluk artışı" },
  { path: "difficulty.speedGrowth",  label: "Tur hız artışı",      min: 0,   max: 0.5,  step: 0.01 },
  { path: "difficulty.spawnGrowth",  label: "Tur spawn hızlanması",min: 0,   max: 0.5,  step: 0.01 },
  { path: "difficulty.sizeShrink",   label: "Tur boyut küçülmesi", min: 0,   max: 0.3,  step: 0.01 },
  { group: "Atış kalitesi modeli (telemetri)" },
  { path: "model.skill",             label: "Beceri (p tavanı)",   min: 0.1, max: 1,    step: 0.01 },
  { path: "model.sizeExp",           label: "Boyut üsteli",        min: 0,   max: 2,    step: 0.05 },
  { path: "model.speedExp",          label: "Hız üsteli",          min: 0,   max: 2,    step: 0.05 },
  { path: "model.centerPenalty",     label: "Merkez cezası",       min: 0,   max: 0.9,  step: 0.05 }
];

const DEFAULTS = JSON.parse(JSON.stringify(CONFIG));

/* ========================== yardımcılar ========================== */
const rand  = (a, b) => a + Math.random() * (b - a);
const pick  = arr => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const fmt   = n => (Math.round(n * 10) / 10).toFixed(1).replace(/\.0$/, "");
const getPath = (obj, path) => path.split(".").reduce((o, k) => o[k], obj);
const setPath = (obj, path, val) => {
  const keys = path.split("."), last = keys.pop();
  keys.reduce((o, k) => o[k], obj)[last] = val;
};

const DUCK_COLORS = [
  { body: "#e0603c", wing: "#ffb454", head: "#3d7f4f" },
  { body: "#5b7fd4", wing: "#9ec1ff", head: "#2c3f78" },
  { body: "#c94f8b", wing: "#ffa8cf", head: "#5c2a4c" },
  { body: "#7bbf5a", wing: "#cdf0a1", head: "#2f6b3d" },
  { body: "#d4b23c", wing: "#fff0a8", head: "#6e5416" }
];

/* ========================== canvas ========================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, S = 1;

function resize() {
  const r = canvas.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = Math.round(r.width);
  H = Math.round(r.height);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = clamp(W / 400, 0.75, 1.8);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));

/* ========================== durum ========================== */
const STATE = { READY: "ready", PLAYING: "playing", ROUNDOVER: "roundover", GAMEOVER: "gameover" };

const game = {
  state: STATE.READY,
  round: 1,
  goal: 10,
  hits: 0,
  ammo: 0,
  runScore: 0,
  roundScore: 0,
  combo: 1,
  bestCombo: 1,
  sinceShot: 0,        // son atıştan beri geçen süre (kombo düşme sayacı)
  comboPulse: 0,       // kombo değişiminde görsel tepki
  comboFlash: "up",    // "up" | "down"
  ammoPulse: 0,
  escapeFlash: 0,
  reload: 0,            // ıska sonrası ateş edilemeyen kalan süre (sn)
  reloadTotal: 0,
  blockedTaps: 0,
  runShots: 0,
  runHits: 0,
  roundShots: 0,
  roundHits: 0,
  escaped: 0,
  runTime: 0,
  ducks: [],
  shots: [],
  popups: [],
  clouds: [],
  spawnTimer: 0,
  endTimer: -1,
  endReason: "",
  endReasonText: "",
  breakTimer: 0,
  inputLock: 0,
  crosshair: null,
  fps: 0
};

/* ========================== telemetri ========================== */
const TELE_KEY = "duckproto.telemetry.v1";
const TELE_MAX_RUNS = 60;

function hashConfig(cfg) {                       // FNV-1a 32-bit → kısa hash
  const str = JSON.stringify(cfg);
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(36).padStart(7, "0").slice(-7);
}

function deviceInfo() {
  const ua = navigator.userAgent || "";
  const type = /iPad/i.test(ua) ? "iPad" : /iPhone|iPod/i.test(ua) ? "iPhone" :
               /Android/i.test(ua) ? "Android" : /Mobile/i.test(ua) ? "Mobile" : "Desktop";
  return {
    type, ua,
    touch: (navigator.maxTouchPoints || 0) > 0,
    screen: { w: screen.width, h: screen.height, dpr: +(window.devicePixelRatio || 1).toFixed(2) },
    stage: { w: W, h: H }
  };
}

const telemetry = {
  run: null,
  saveFailed: false,

  load() {
    try { const raw = localStorage.getItem(TELE_KEY); return raw ? JSON.parse(raw) : { runs: [] }; }
    catch (e) { return { runs: [] }; }
  },
  save(store) {
    while (store.runs.length > TELE_MAX_RUNS) store.runs.shift();
    for (let i = 0; i < 4; i++) {
      try { localStorage.setItem(TELE_KEY, JSON.stringify(store)); this.saveFailed = false; return true; }
      catch (e) { store.runs.splice(0, Math.max(1, Math.ceil(store.runs.length / 4))); }
    }
    this.saveFailed = true;
    return false;
  },
  count() { return this.load().runs.length; },
  clear() { try { localStorage.removeItem(TELE_KEY); } catch (e) {} this.run = null; },
  now() { return this.run ? +((performance.now() - this.run._t0) / 1000).toFixed(3) : 0; },

  startRun() {
    if (this.run) this.endRun("abandoned");
    this.run = {
      startedAt: new Date().toISOString(),
      _t0: performance.now(),
      gameVersion: GAME_VERSION,
      configHash: hashConfig(CONFIG),
      config: JSON.parse(JSON.stringify(CONFIG)),
      device: deviceInfo(),
      shots: [], duckEvents: [], rounds: [], _round: null
    };
  },
  startRound(round, goal, ammo) {
    if (!this.run) return;
    this.endRoundRecord(false);
    const t = this.now();
    this.run._round = {
      round, goal, t0: t, dur: 0, score: 0, shots: 0, hits: 0, escaped: 0, blockedTaps: 0, cleared: false,
      pool: poolFor(round),
      ammoCurve: [[t, ammo]], comboCurve: [[t, 1]]
    };
  },
  ammoAt(ammo) { const r = this.run && this.run._round; if (r) r.ammoCurve.push([this.now(), ammo]); },
  comboAt(c)   { const r = this.run && this.run._round; if (r) r.comboCurve.push([this.now(), +c.toFixed(2)]); },
  addScore(v)  { const r = this.run && this.run._round; if (r) r.score += v; },
  blockedTap() {
    const r = this.run && this.run._round;
    if (r) r.blockedTaps = (r.blockedTaps || 0) + 1;
  },
  duckEvent(ev, d) {
    if (!this.run || game.state !== STATE.PLAYING) return;
    this.run.duckEvents.push({
      t: this.now(), ev, id: d.id, round: game.round,
      scale: +d.scale.toFixed(3), speed: Math.round(d.speed),
      x: Math.round(d.x), y: Math.round(d.y)
    });
    const r = this.run._round;
    if (r) { if (ev === "hit") r.hits++; else if (ev === "escape") r.escaped++; }
  },
  shot(rec) {
    if (!this.run) return;
    this.run.shots.push(rec);
    if (this.run._round) this.run._round.shots++;
  },
  endRoundRecord(cleared) {
    const r = this.run && this.run._round;
    if (!r) return;
    r.dur = +(this.now() - r.t0).toFixed(2);
    r.cleared = !!cleared;
    this.run.rounds.push(r);
    this.run._round = null;
  },
  endRun(reason) {
    if (!this.run) return;
    this.endRoundRecord(false);
    const r = this.run;
    r.duration = +this.now().toFixed(2);
    r.endReason = reason || "";
    r.roundReached = game.round;
    r.roundsCleared = r.rounds.filter(x => x.cleared).length;
    r.score = game.runScore;
    r.shotCount = r.shots.length;
    r.hitCount = r.shots.filter(x => x.hit).length;
    r.escapedCount = r.duckEvents.filter(x => x.ev === "escape").length;
    r.blockedTaps = r.rounds.reduce((a, x) => a + (x.blockedTaps || 0), 0);
    delete r._round; delete r._t0;
    const store = this.load();
    store.runs.push(r);
    this.save(store);
    this.run = null;
    updateTeleCount();
  }
};

/* --- turdan tura ölçekler --- */
const speedMul = () => Math.pow(1 + CONFIG.difficulty.speedGrowth, game.round - 1);
const spawnMul = () => Math.max(0.12, Math.pow(1 - CONFIG.difficulty.spawnGrowth, game.round - 1));
const sizeMul  = () => Math.max(CONFIG.duck.minScale, Math.pow(1 - CONFIG.difficulty.sizeShrink, game.round - 1));
const goalFor  = r => Math.round(CONFIG.round.goal + CONFIG.round.goalGrowth * (r - 1));
const poolFor  = r => Math.max(1, Math.round(CONFIG.ammo.poolSize + CONFIG.ammo.poolGrowthPerRound * (r - 1)));
const duckW    = () => CONFIG.duck.width * sizeMul();
const duckH    = () => CONFIG.duck.height * sizeMul();
/* Turu geçmek için gereken teorik isabet oranı: hedef / (hedef + harcanabilir ıska) */
const neededAcc = () => {
  const net = 1 - CONFIG.ammo.refundOnHit;               // isabet başına net mermi maliyeti
  const cost = Math.max(1, Math.round(CONFIG.ammo.missCost));
  const budget = poolFor(game.round) - 1 - game.goal * net;
  const maxMiss = Math.floor(budget / cost);
  return maxMiss <= 0 ? 1 : game.goal / (game.goal + maxMiss);
};

const hudH = () => 156 * S;

/* Atış kalitesi: boyut × hız × merkeze uzaklık (0..1, beceriden bağımsız) */
function shotQuality(d) {
  const m = CONFIG.model;
  const sizeF = Math.pow(Math.max(0.01, d.scale), m.sizeExp);
  const spdF = Math.pow(CONFIG.duck.speed / Math.max(1, d.speed), m.speedExp);
  const cx = W / 2, cy = hudH() + (H - hudH()) / 2;
  const half = Math.max(1, Math.hypot(W / 2, (H - hudH()) / 2));
  const dist = Math.min(1, Math.hypot(d.x - cx, d.y - cy) / half);
  return clamp(sizeF * spdF * (1 - m.centerPenalty * dist), 0, 1.5);
}
const predictedP = d => clamp(CONFIG.model.skill * shotQuality(d), 0.02, 0.98);

const spawnDelay = () => {
  const base = CONFIG.spawn.interval * spawnMul();
  const j = CONFIG.spawn.intervalJitter;
  return Math.max(CONFIG.spawn.minInterval, base * (1 + rand(-j, j))) / 1000;
};

function makeClouds() {
  game.clouds = [];
  for (let i = 0; i < 5; i++) {
    game.clouds.push({
      x: rand(-60, W), y: rand(H * 0.06, H * 0.42),
      w: rand(50, 130), h: rand(10, 20), v: rand(4, 14), a: rand(0.05, 0.13)
    });
  }
}

/* ========================== ördekler ========================== */
let duckId = 0;

function spawnDuck() {
  const c = CONFIG.duck;
  const w = duckW(), h = duckH();
  const margin = Math.max(w, h) + c.waveAmplitude + 30;
  const speed = Math.max(20, c.speed * speedMul() * (1 + rand(-c.speedJitter, c.speedJitter)));
  const edge = pick(["bottom", "bottom", "left", "right"]);
  let ox, oy, dir;

  if (edge === "bottom") {
    ox = rand(W * 0.12, W * 0.88);
    oy = H + margin * 0.5;
    const a = rand(-0.55, 0.55);
    dir = { x: Math.sin(a), y: -Math.cos(a) };
  } else {
    const fromLeft = edge === "left";
    ox = fromLeft ? -margin : W + margin;
    oy = rand(H * 0.24, H * 0.72);
    const a = rand(0.05, 0.45);
    dir = { x: (fromLeft ? 1 : -1) * Math.cos(a), y: -Math.sin(a) };
  }

  const duck = {
    id: ++duckId,
    ox, oy, dir,
    perp: { x: -dir.y, y: dir.x },
    x: ox, y: oy, px: ox,
    speed, phase: rand(0, Math.PI * 2), age: 0,
    flap: rand(0, Math.PI * 2),
    colors: pick(DUCK_COLORS),
    scale: sizeMul(),
    falling: false, vx: 0, vy: 0, rot: 0, spin: 0,
    entered: false
  };
  game.ducks.push(duck);
  telemetry.duckEvent("spawn", duck);
}

function updateDucks(dt) {
  const c = CONFIG.duck;
  for (let i = game.ducks.length - 1; i >= 0; i--) {
    const d = game.ducks[i];
    d.px = d.x;

    if (d.falling) {
      d.vy += c.fallGravity * dt;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.rot += d.spin * dt;
      if (d.y - c.height > H + 80) game.ducks.splice(i, 1);
      continue;
    }

    d.age += dt;
    d.flap += dt * 12;
    const travel = d.speed * d.age;
    const off = c.waveAmplitude * Math.sin(2 * Math.PI * c.waveFrequency * d.age + d.phase);
    d.x = d.ox + d.dir.x * travel + d.perp.x * off;
    d.y = d.oy + d.dir.y * travel + d.perp.y * off;

    const m = Math.max(c.width, c.height);
    if (d.x > -m && d.x < W + m && d.y > -m && d.y < H + m) d.entered = true;

    const gone = d.y < -m * 1.6 || d.x < -m * 1.6 || d.x > W + m * 1.6 || d.y > H + m * 3;
    if ((d.entered && gone) || d.age > 18) {
      game.ducks.splice(i, 1);
      if (game.state === STATE.PLAYING) {
        game.escaped++;
        telemetry.duckEvent("escape", d);
        const ex = clamp(d.x, 40, W - 40), ey = clamp(d.y, 176 * S, H - 60);
        const escCost = Math.max(0, Math.round(CONFIG.ammo.escapeCost));
        if (escCost > 0 && game.endTimer < 0) {
          game.ammo -= escCost;
          game.ammoPulse = 1;
          game.escapeFlash = 1;
          telemetry.ammoAt(game.ammo);
          addPopup(ex, ey, "KAÇTI  −" + escCost, "#ff9f43", 1.05);
          game.shots.push({ x: ex, y: ey, age: 0, hit: false, escape: true });
          if (game.ammo <= 0) endRun("Kaçan ördekler mermiyi bitirdi");
        } else {
          addPopup(ex, ey, "KAÇTI", "#8fa3bd", 0.85);
        }
      }
    }
  }
}

function duckRect(d) {
  const p = CONFIG.duck.hitPadding, w = duckW(), h = duckH();
  return { x: d.x - w / 2 - p, y: d.y - h / 2 - p, w: w + p * 2, h: h + p * 2 };
}

/* ========================== atış & mermi ekonomisi ========================== */
function nearestDuck(x, y) {                     // ıskada "niyet edilen" hedef
  let best = null, bd = 150 * S;
  for (const d of game.ducks) {
    if (d.falling) continue;
    const dist = Math.hypot(d.x - x, d.y - y);
    if (dist < bd) { bd = dist; best = d; }
  }
  return best;
}

function shoot(x, y) {
  const comboBefore = game.combo;

  let hit = null;
  for (let i = game.ducks.length - 1; i >= 0; i--) {
    const d = game.ducks[i];
    if (d.falling) continue;
    const r = duckRect(d);
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { hit = d; break; }
  }

  // model tahmini, ördek düşmeden önce hesaplanır
  const target = hit || nearestDuck(x, y);
  const tRec = target ? {
    id: target.id,
    w: Math.round(duckW()), h: Math.round(duckH()),
    scale: +target.scale.toFixed(3), speed: Math.round(target.speed),
    x: Math.round(target.x), y: Math.round(target.y),
    dist: Math.round(Math.hypot(target.x - x, target.y - y))
  } : null;
  const tp = target ? +predictedP(target).toFixed(3) : null;
  const tq = target ? +shotQuality(target).toFixed(3) : null;

  game.ammo -= 1;                       // her atış 1 mermi
  game.runShots++; game.roundShots++;
  game.sinceShot = 0;

  if (hit) {
    hit.falling = true;
    hit.vx = (hit.x - hit.px) * 6;
    hit.vy = -110;
    hit.spin = (Math.random() < 0.5 ? -1 : 1) * CONFIG.duck.fallSpin;

    game.ammo += CONFIG.ammo.refundOnHit;   // isabette mermi geri gelir
    game.hits++; game.runHits++; game.roundHits++;

    const gain = Math.round(CONFIG.score.perDuck * game.combo);
    game.roundScore += gain;
    game.runScore += gain;
    telemetry.duckEvent("hit", hit);
    telemetry.addScore(gain);
    addPopup(hit.x, hit.y - 18, "+" + gain, "#ffd166", 1.05);
    if (CONFIG.ammo.refundOnHit > 0) addPopup(hit.x, hit.y + 6, "+" + CONFIG.ammo.refundOnHit + " mermi", "#7fd4ff", 0.7);

    setCombo(clamp(game.combo + CONFIG.combo.step, 1, CONFIG.combo.max), "up");
    game.bestCombo = Math.max(game.bestCombo, game.combo);
    game.shots.push({ x, y, age: 0, hit: true });
  } else {
    game.ammo -= Math.max(0, Math.round(CONFIG.ammo.missCost) - 1);   // atış zaten 1 götürdü
    game.reload = game.reloadTotal = Math.max(0, CONFIG.ammo.missReloadDelay);
    setCombo(1, "down");
    game.shots.push({ x, y, age: 0, hit: false });
    addPopup(x, y - 14, "ISKA  -" + Math.round(CONFIG.ammo.missCost), "#ff7b6b", 0.85);
    game.ammoPulse = 1;
  }

  telemetry.ammoAt(game.ammo);
  telemetry.shot({
    t: telemetry.now(), round: game.round, hit: !!hit,
    x: Math.round(x), y: Math.round(y),
    p: tp, q: tq, target: tRec, reloadLeft: +game.reload.toFixed(2),
    combo: +comboBefore.toFixed(2), ammo: game.ammo
  });

  if (game.hits >= game.goal) finishRound();
  else if (game.ammo <= 0) endRun("Mermi tükendi");
}

function setCombo(value, dir) {
  if (Math.abs(value - game.combo) > 0.001) {
    game.comboPulse = 1;
    game.comboFlash = dir;
    telemetry.comboAt(value);
  }
  game.combo = value;
}

function addPopup(x, y, text, color, scale) {
  // yazı ekran kenarında kırpılmasın
  game.popups.push({ x: clamp(x, 62 * S, W - 62 * S), y, text, color, scale: scale || 1, life: 0, ttl: 0.9 });
}

/* ========================== tur / run akışı ========================== */
function startRun() {
  game.round = 1;
  game.runScore = 0;
  game.bestCombo = 1;
  game.runShots = 0; game.runHits = 0; game.escaped = 0;
  game.runTime = 0;
  game.ammo = poolFor(1);
  telemetry.startRun();
  startRound();
}

function startRound() {
  game.goal = goalFor(game.round);
  game.hits = 0;
  game.roundScore = 0;
  game.roundShots = 0; game.roundHits = 0;
  game.combo = 1;                      // her tur başında 1x'e döner
  game.comboPulse = 0;
  game.reload = 0; game.reloadTotal = 0; game.blockedTaps = 0;
  game.sinceShot = 0;
  if (CONFIG.ammo.refillEachRound >= 0.5 || game.round === 1) {
    game.ammo = poolFor(game.round);
  }
  game.ducks.length = 0;
  game.spawnTimer = CONFIG.spawn.firstDelay / 1000;
  game.endTimer = -1;
  game.inputLock = 0.2;
  if (game.ammo <= 0) {              // taşımalı modda havuz boş kaldıysa run biter
    game.state = STATE.GAMEOVER;
    game.endReasonText = "Mermi tükendi";
    telemetry.endRun(game.endReasonText);
    return;
  }
  telemetry.startRound(game.round, game.goal, game.ammo);
  game.state = STATE.PLAYING;
}

function finishRound() {
  if (game.endTimer >= 0) return;
  game.endReason = "round";
  game.endTimer = CONFIG.round.endDelay / 1000;
}

function endRun(reason) {
  if (game.endTimer >= 0 && game.endReason === "run") return;
  game.endReason = "run";
  game.endReasonText = reason;
  game.endTimer = CONFIG.round.endDelay / 1000;
}

function updateRound(dt) {
  if (game.state !== STATE.PLAYING) return;
  game.runTime += dt;

  // kombo zamanla düşer: son atıştan beri decayTime geçtiyse bir kademe in
  if (game.reload > 0) game.reload = Math.max(0, game.reload - dt);
  game.sinceShot += dt;
  if (game.combo > 1 && game.sinceShot >= CONFIG.combo.decayTime) {
    setCombo(Math.max(1, game.combo - CONFIG.combo.step), "down");
    game.sinceShot = 0;
    addPopup(W / 2, 186 * S, "KOMBO DÜŞTÜ", "#ff7b6b", 0.8);
  }

  if (game.endTimer < 0 && game.ducks.length < Math.round(CONFIG.spawn.maxAlive)) {
    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0) {
      spawnDuck();
      game.spawnTimer = spawnDelay();
    }
  }

  if (game.endTimer >= 0) {
    game.endTimer -= dt;
    if (game.endTimer <= 0) {
      if (game.endReason === "run") {
        game.state = STATE.GAMEOVER;
        telemetry.endRun(game.endReasonText || "Mermi tükendi");
      } else {
        telemetry.endRoundRecord(true);
        game.state = STATE.ROUNDOVER;
        game.breakTimer = CONFIG.round.breakDuration / 1000;
      }
      game.inputLock = 0.35;
    }
  }
}

function nextRound() {
  game.round++;
  startRound();
}

/* ========================== girdi ========================== */
function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function handlePress(x, y) {
  if (game.inputLock > 0) return;
  if (game.state === STATE.READY)     { startRun(); return; }
  if (game.state === STATE.ROUNDOVER) { nextRound(); return; }
  if (game.state === STATE.GAMEOVER)  { startRun(); return; }
  if (game.state !== STATE.PLAYING || game.endTimer >= 0 || game.ammo <= 0) return;
  if (game.reload > 0) {                       // dolum sürüyor: atış yok, ceza da yok
    game.blockedTaps++;
    game.shots.push({ x, y, age: 0, hit: false, blocked: true });
    telemetry.blockedTap();
    return;
  }
  shoot(x, y);
}

if (window.PointerEvent) {
  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    const p = pointerPos(e);
    if (e.pointerType === "mouse") game.crosshair = p;
    handlePress(p.x, p.y);
  });
  canvas.addEventListener("pointermove", e => {
    if (e.pointerType === "mouse") game.crosshair = pointerPos(e);
  });
  canvas.addEventListener("pointerleave", e => {
    if (e.pointerType === "mouse") game.crosshair = null;
  });
} else {
  canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    const t = e.changedTouches[0], r = canvas.getBoundingClientRect();
    handlePress(t.clientX - r.left, t.clientY - r.top);
  }, { passive: false });
  canvas.addEventListener("mousedown", e => {
    const p = pointerPos(e); game.crosshair = p; handlePress(p.x, p.y);
  });
  canvas.addEventListener("mousemove", e => { game.crosshair = pointerPos(e); });
}
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("gesturestart", e => e.preventDefault());

/* ========================== çizim ========================== */
function drawBackground(dt) {
  const groundY = H * 0.86;
  const sky = ctx.createLinearGradient(0, 0, 0, groundY);
  sky.addColorStop(0, "#152444");
  sky.addColorStop(0.55, "#39598c");
  sky.addColorStop(1, "#e2925a");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, groundY);

  ctx.fillStyle = "rgba(255,214,140,.35)";
  ctx.fillRect(W * 0.62, groundY - 110 * S, 70 * S, 70 * S);

  for (const c of game.clouds) {
    c.x += c.v * dt;
    if (c.x > W + 140) { c.x = -140; c.y = rand(H * 0.06, H * 0.42); }
    ctx.fillStyle = "rgba(255,255,255," + c.a + ")";
    ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.fillRect(c.x + c.w * 0.25, c.y - c.h * 0.6, c.w * 0.5, c.h * 0.7);
  }

  ctx.fillStyle = "#123027";
  ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = "#1b4534";
  for (let x = 0; x < W; x += 14) {
    const h = 10 + ((x * 37) % 22);
    ctx.fillRect(x, groundY - h * 0.5, 8, h);
  }
  ctx.fillStyle = "#0d211b";
  ctx.fillRect(0, H - 26 * S, W, 26 * S);
}

function drawDuck(d) {
  const w = d.falling ? CONFIG.duck.width * d.scale : duckW();
  const h = d.falling ? CONFIG.duck.height * d.scale : duckH();
  const facing = (d.x - d.px) >= 0 ? 1 : -1;
  const col = d.colors;

  ctx.save();
  ctx.translate(d.x, d.y);
  ctx.rotate(d.rot);
  ctx.scale(facing, 1);
  if (d.falling) ctx.globalAlpha = 0.85;

  ctx.fillStyle = "rgba(0,0,0,.25)";
  ctx.fillRect(-w / 2 + 3, -h / 2 + 3, w, h);
  ctx.fillStyle = d.falling ? "#8a8f98" : col.body;
  ctx.fillRect(-w / 2, -h / 2, w, h);

  const flap = d.falling ? -h * 0.15 : Math.sin(d.flap) * h * 0.3;
  ctx.fillStyle = d.falling ? "#b8bec7" : col.wing;
  ctx.fillRect(-w * 0.28, -h * 0.12 + flap, w * 0.46, h * 0.4);

  ctx.fillStyle = d.falling ? "#6f747c" : col.head;
  ctx.fillRect(w * 0.22, -h * 0.95, w * 0.34, h * 0.62);
  ctx.fillStyle = "#ffb03a";
  ctx.fillRect(w * 0.54, -h * 0.66, w * 0.22, h * 0.16);

  ctx.fillStyle = "#0d1016";
  if (d.falling) {
    ctx.fillRect(w * 0.30, -h * 0.80, w * 0.12, 2.5);
    ctx.fillRect(w * 0.34, -h * 0.86, 2.5, w * 0.12);
  } else {
    ctx.fillRect(w * 0.36, -h * 0.78, Math.max(2, w * 0.09), Math.max(2, w * 0.09));
  }

  ctx.fillStyle = d.falling ? "#8a8f98" : col.wing;
  ctx.fillRect(-w * 0.62, -h * 0.28, w * 0.14, h * 0.34);
  ctx.restore();
}

function drawShots(dt) {
  for (let i = game.shots.length - 1; i >= 0; i--) {
    const s = game.shots[i];
    s.age += dt;
    const t = s.age / 0.35;
    if (t >= 1) { game.shots.splice(i, 1); continue; }
    const size = (14 + t * (s.escape ? 52 : s.blocked ? 18 : 34)) * S;
    ctx.save();
    ctx.globalAlpha = (1 - t) * (s.blocked ? 0.55 : 1);
    ctx.strokeStyle = s.escape ? "#ff9f43" : s.blocked ? "#8fa3bd" : (s.hit ? "#ffd166" : "#ff7b6b");
    ctx.lineWidth = (s.escape ? 4 : 3) * S;
    ctx.strokeRect(s.x - size / 2, s.y - size / 2, size, size);
    if (s.escape) {
      ctx.lineWidth = 2 * S;
      ctx.strokeRect(s.x - size * 0.28, s.y - size * 0.28, size * 0.56, size * 0.56);
    }
    ctx.restore();
  }
}

function drawPopups(dt) {
  for (let i = game.popups.length - 1; i >= 0; i--) {
    const p = game.popups[i];
    p.life += dt;
    if (p.life >= p.ttl) { game.popups.splice(i, 1); continue; }
    const k = p.life / p.ttl;
    ctx.save();
    ctx.globalAlpha = 1 - k * k;
    ctx.fillStyle = p.color;
    ctx.font = "700 " + Math.round(15 * S * p.scale) + "px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center";
    ctx.fillText(p.text, p.x, p.y - k * 32 * S);
    ctx.restore();
  }
}

function drawCrosshair() {
  const p = game.crosshair;
  if (!p || game.state !== STATE.PLAYING) return;
  const s = 13 * S;
  ctx.save();
  ctx.globalAlpha = game.reload > 0 ? 0.45 : 0.75;
  ctx.fillStyle = game.reload > 0 ? "#8fa3bd" : (game.ammo > 0 ? "#ffffff" : "#ff7b6b");
  ctx.fillRect(p.x - s, p.y - 1.5 * S, s * 0.55, 3 * S);
  ctx.fillRect(p.x + s * 0.45, p.y - 1.5 * S, s * 0.55, 3 * S);
  ctx.fillRect(p.x - 1.5 * S, p.y - s, 3 * S, s * 0.55);
  ctx.fillRect(p.x - 1.5 * S, p.y + s * 0.45, 3 * S, s * 0.55);
  ctx.restore();
}

const comboColor = c =>
  c >= CONFIG.combo.max - 0.001 ? "#ff5d5d" :
  c >= 3 ? "#ff9f43" :
  c >= 2 ? "#ffd166" :
  c > 1   ? "#c9e58a" : "#6f8098";

function drawHUD(dt) {
  const pad = 12 * S;
  const low = game.ammo <= Math.round(CONFIG.ammo.lowWarning);
  ctx.save();
  ctx.textBaseline = "top";

  // ---- üst şerit ----
  ctx.fillStyle = "rgba(6,10,18,.66)";
  ctx.fillRect(0, 0, W, hudH());
  ctx.fillStyle = "rgba(255,255,255,.12)";
  ctx.fillRect(0, hudH(), W, 1);

  // run skoru
  ctx.textAlign = "left";
  ctx.fillStyle = "#8fa8c6";
  ctx.font = "700 " + Math.round(9.5 * S) + "px ui-monospace, Menlo, monospace";
  ctx.fillText("RUN SKORU", pad, pad);
  ctx.fillStyle = "#ffffff";
  ctx.font = "700 " + Math.round(25 * S) + "px ui-monospace, Menlo, monospace";
  ctx.fillText(String(game.runScore), pad, pad + 12 * S);

  // tur + hedef (debug butonunun solunda)
  const rx = W - pad - 44 * S;
  ctx.textAlign = "right";
  ctx.fillStyle = "#8fa8c6";
  ctx.font = "700 " + Math.round(9.5 * S) + "px ui-monospace, Menlo, monospace";
  ctx.fillText("TUR " + game.round + " · HEDEF", rx, pad);
  ctx.fillStyle = game.hits >= game.goal ? "#7bd88f" : "#ffffff";
  ctx.font = "700 " + Math.round(22 * S) + "px ui-monospace, Menlo, monospace";
  ctx.fillText(game.hits + "/" + game.goal, rx, pad + 12 * S);

  // hedef çubuğu
  const barW = 92 * S, barH = 5 * S, barX = rx - barW, barY = pad + 38 * S;
  ctx.fillStyle = "rgba(255,255,255,.15)";
  ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = "#7bd88f";
  ctx.fillRect(barX, barY, barW * clamp(game.hits / Math.max(1, game.goal), 0, 1), barH);

  // ---- mermi ----
  if (game.ammoPulse > 0) game.ammoPulse = Math.max(0, game.ammoPulse - dt * 2.2);
  const ay = pad + 46 * S;
  ctx.textAlign = "left";
  ctx.fillStyle = low ? "#ff7b6b" : "#8fa8c6";
  ctx.font = "700 " + Math.round(9.5 * S) + "px ui-monospace, Menlo, monospace";
  ctx.fillText("MERMİ", pad, ay);

  const blink = low ? 0.55 + 0.45 * Math.sin(performance.now() / 110) : 1;
  ctx.globalAlpha = blink;
  ctx.fillStyle = low ? "#ff5d5d" : "#ffd166";
  ctx.font = "700 " + Math.round((26 + game.ammoPulse * 6) * S) + "px ui-monospace, Menlo, monospace";
  ctx.fillText(String(Math.max(0, game.ammo)), pad, ay + 11 * S);
  ctx.globalAlpha = 1;

  // mermi pipleri
  const poolMax = poolFor(game.round);
  if (poolMax <= 20) {
    const pipW = Math.min(7 * S, (W * 0.42) / poolMax - 2 * S);
    const pipH = 15 * S, gap = 2.5 * S;
    const px0 = pad + 40 * S, py0 = ay + 16 * S;
    for (let i = 0; i < poolMax; i++) {
      const x = px0 + i * (pipW + gap);
      if (i < game.ammo) {
        ctx.globalAlpha = blink;
        ctx.fillStyle = low ? "#ff5d5d" : "#ffd166";
        ctx.fillRect(x, py0, pipW, pipH);
        ctx.globalAlpha = 1;
      } else {
        ctx.strokeStyle = "rgba(255,255,255,.22)";
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, py0 + 0.5, pipW, pipH);
      }
    }
  }

  // ---- ıska sonrası yeniden doldurma ----
  if (game.reload > 0 && game.reloadTotal > 0) {
    const k = game.reload / game.reloadTotal;
    const rw = 96 * S, rh = 6 * S, rx0 = pad, ry0 = ay + 34 * S;
    ctx.fillStyle = "rgba(255,255,255,.15)";
    ctx.fillRect(rx0, ry0, rw, rh);
    ctx.fillStyle = "#7fd4ff";
    ctx.fillRect(rx0, ry0, rw * (1 - k), rh);
    ctx.fillStyle = "#7fd4ff";
    ctx.font = "700 " + Math.round(9 * S) + "px ui-monospace, Menlo, monospace";
    ctx.textAlign = "left";
    ctx.fillText("DOLDURULUYOR", rx0 + rw + 6 * S, ry0 - 1 * S);
  }

  // ---- kombo ----
  if (game.comboPulse > 0) game.comboPulse = Math.max(0, game.comboPulse - dt * 2.6);
  const remain = CONFIG.combo.decayTime - game.sinceShot;
  const warning = game.state === STATE.PLAYING && game.combo > 1 && remain <= CONFIG.combo.warnTime;
  const pulseScale = 1 + game.comboPulse * (game.comboFlash === "up" ? 0.55 : 0.28);
  const cy = 114 * S;
  ctx.textAlign = "center";
  ctx.fillStyle = "#8fa8c6";
  ctx.font = "700 " + Math.round(9.5 * S) + "px ui-monospace, Menlo, monospace";
  ctx.fillText("KOMBO", W / 2, cy - 12 * S);

  let cc = comboColor(game.combo);
  if (game.comboPulse > 0 && game.comboFlash === "down") cc = "#ff5d5d";
  if (warning && Math.sin(performance.now() / 70) > 0) cc = "#ffffff";
  ctx.fillStyle = cc;
  ctx.font = "700 " + Math.round(30 * S * pulseScale) + "px ui-monospace, Menlo, monospace";
  ctx.fillText("x" + fmt(game.combo), W / 2, cy);

  // kombo düşme çubuğu
  if (game.state === STATE.PLAYING && game.combo > 1) {
    const cw = 84 * S, ch = 4 * S, cx0 = W / 2 - cw / 2, cy0 = cy + 33 * S;
    ctx.fillStyle = "rgba(255,255,255,.15)";
    ctx.fillRect(cx0, cy0, cw, ch);
    ctx.fillStyle = warning ? "#ff5d5d" : "#7fd4ff";
    ctx.fillRect(cx0, cy0, cw * clamp(remain / Math.max(0.1, CONFIG.combo.decayTime), 0, 1), ch);
  }

  ctx.restore();

  // kaçış flaşı
  if (game.escapeFlash > 0) {
    game.escapeFlash = Math.max(0, game.escapeFlash - dt * 2.5);
    ctx.save();
    ctx.globalAlpha = game.escapeFlash * 0.5;
    ctx.strokeStyle = "#ff9f43";
    ctx.lineWidth = 10 * S;
    ctx.strokeRect(5 * S, 5 * S, W - 10 * S, H - 10 * S);
    ctx.restore();
  }

  // düşük mermi çerçevesi
  if (low && game.state === STATE.PLAYING) {
    ctx.save();
    ctx.globalAlpha = 0.25 + 0.25 * Math.sin(performance.now() / 140);
    ctx.strokeStyle = "#ff3b3b";
    ctx.lineWidth = 8 * S;
    ctx.strokeRect(4 * S, 4 * S, W - 8 * S, H - 8 * S);
    ctx.restore();
  }
}

function drawOverlay() {
  if (game.state === STATE.PLAYING) return;
  ctx.save();
  ctx.fillStyle = "rgba(6,10,18,.78)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  const cx = W / 2, cy = H * 0.40;
  const L = (t, dy, size, color, weight) => {
    ctx.fillStyle = color;
    ctx.font = (weight || "400") + " " + Math.round(size * S) + "px ui-monospace, Menlo, monospace";
    ctx.fillText(t, cx, cy + dy * S);
  };

  if (game.state === STATE.READY) {
    L("DUCK PROTO", -96, 13, "#7fd4ff", "700");
    L("ÖRDEK AVI", -66, 34, "#ffffff", "700");
    L(poolFor(1) + " mermilik ortak havuz", -18, 13, "#b9c9dd");
    L("isabet net 0  ·  ıska −" + Math.round(CONFIG.ammo.missCost) +
      "  ·  kaçan ördek −" + Math.round(CONFIG.ammo.escapeCost), 2, 13, "#b9c9dd");
    L("tur hedefi: " + goalFor(1) + " ördek (+" + CONFIG.round.goalGrowth + "/tur, havuz +" +
      Math.round(CONFIG.ammo.poolGrowthPerRound) + ")", 22, 13, "#b9c9dd");
    L("ıskadan sonra " + CONFIG.ammo.missReloadDelay.toFixed(2) + " sn yeniden doldurma", 42, 13, "#b9c9dd");
    L("kombo " + CONFIG.combo.decayTime + " sn ateş edilmezse düşer", 62, 13, "#b9c9dd");
    L("BAŞLAMAK İÇİN DOKUN", 104, 15, "#ffd166", "700");
  } else if (game.state === STATE.ROUNDOVER) {
    L("TUR " + game.round + " TAMAM", -92, 13, "#7bd88f", "700");
    L("+" + game.roundScore, -58, 34, "#ffffff", "700");
    L("tur skoru", -22, 12, "#8fa8c6");
    L("isabet " + game.roundHits + "/" + game.roundShots + " atış  ·  " +
      Math.round(100 * game.roundHits / Math.max(1, game.roundShots)) + "% isabet", 2, 12, "#b9c9dd");
    L("kalan mermi: " + game.ammo + (CONFIG.ammo.refillEachRound >= 0.5 ? "  (havuz yenilenecek)" : "  (taşınacak)"), 22, 12, "#b9c9dd");
    L("run skoru: " + game.runScore, 42, 12, "#b9c9dd");
    L("SONRAKİ TUR: " + goalFor(game.round + 1) + " ÖRDEK", 84, 14, "#ffd166", "700");
    L("dokun ya da bekle", 106, 11, "#7f93ad");
  } else {
    L("RUN BİTTİ", -108, 13, "#ff7b6b", "700");
    L(String(game.runScore), -72, 40, "#ffffff", "700");
    L("run skoru", -32, 12, "#8fa8c6");
    L(game.endReasonText || "Mermi tükendi", -8, 13, "#ff9f43");
    L("tur " + game.round + "  ·  hedefin " + game.hits + "/" + game.goal + "'i", 16, 12, "#b9c9dd");
    L("isabet " + game.runHits + "/" + game.runShots + " atış  ·  " +
      Math.round(100 * game.runHits / Math.max(1, game.runShots)) + "% isabet", 36, 12, "#b9c9dd");
    L("en yüksek kombo x" + fmt(game.bestCombo) + "  ·  kaçan " + game.escaped, 56, 12, "#b9c9dd");
    L("süre " + Math.floor(game.runTime / 60) + ":" + String(Math.floor(game.runTime % 60)).padStart(2, "0"), 76, 12, "#b9c9dd");
    L("YENİ RUN İÇİN DOKUN", 118, 15, "#ffd166", "700");
  }
  ctx.restore();
}

/* ========================== ana döngü ========================== */
let last = performance.now(), fpsAcc = 0, fpsFrames = 0;

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  dt = clamp(dt, 0, 0.05);

  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 0.4) { game.fps = Math.round(fpsFrames / fpsAcc); fpsAcc = 0; fpsFrames = 0; updateDebugStats(); }

  if (game.inputLock > 0) game.inputLock -= dt;
  if (game.state === STATE.ROUNDOVER) {
    game.breakTimer -= dt;
    if (game.breakTimer <= 0) nextRound();
  }

  updateRound(dt);
  updateDucks(dt);

  drawBackground(dt);
  for (const d of game.ducks) drawDuck(d);
  drawShots(dt);
  drawPopups(dt);
  drawCrosshair();
  drawHUD(dt);
  drawOverlay();

  requestAnimationFrame(frame);
}

/* ========================== debug paneli ========================== */
const dbgPanel = document.getElementById("dbgPanel");
const dbgToggle = document.getElementById("dbgToggle");
let statsEl = null;

function buildDebugPanel() {
  dbgPanel.innerHTML = "";
  const title = document.createElement("h3");
  title.textContent = "Debug / Ayarlar";
  dbgPanel.appendChild(title);

  statsEl = document.createElement("div");
  statsEl.className = "dbg-stats";
  dbgPanel.appendChild(statsEl);

  for (const item of SLIDERS) {
    if (item.group) {
      const g = document.createElement("div");
      g.className = "dbg-group";
      g.textContent = item.group;
      dbgPanel.appendChild(g);
      continue;
    }
    const row = document.createElement("div");
    row.className = "dbg-row";
    const label = document.createElement("label");
    const name = document.createElement("span");
    name.textContent = item.label;
    const val = document.createElement("b");
    const input = document.createElement("input");
    input.type = "range";
    input.min = item.min; input.max = item.max; input.step = item.step;
    input.value = getPath(CONFIG, item.path);
    val.textContent = input.value;
    input.addEventListener("input", () => {
      setPath(CONFIG, item.path, parseFloat(input.value));
      val.textContent = input.value;
    });
    label.appendChild(name); label.appendChild(val);
    row.appendChild(label); row.appendChild(input);
    dbgPanel.appendChild(row);
    item._input = input; item._val = val;
  }

  const btns = document.createElement("div");
  btns.className = "dbg-btns";
  const mk = (text, fn) => {
    const b = document.createElement("button");
    b.textContent = text; b.addEventListener("click", fn); btns.appendChild(b);
  };
  mk("Turu yenile", () => startRound());
  mk("Varsayılan", () => {
    const d = JSON.parse(JSON.stringify(DEFAULTS));
    for (const k of Object.keys(d)) Object.assign(CONFIG[k], d[k]);
    syncSliders();
  });
  mk("Yeni run", () => startRun());
  dbgPanel.appendChild(btns);
}

function syncSliders() {
  for (const item of SLIDERS) {
    if (!item._input) continue;
    item._input.value = getPath(CONFIG, item.path);
    item._val.textContent = item._input.value;
  }
}

function updateDebugStats() {
  if (!statsEl || dbgPanel.hidden) return;
  statsEl.innerHTML =
    "fps <span>" + game.fps + "</span> · ördek <span>" + game.ducks.length + "</span> · durum <span>" + game.state + "</span><br>" +
    "hız <span>x" + fmt(speedMul()) + "</span> · boyut <span>x" + fmt(sizeMul()) + "</span> · spawn <span>" +
      Math.round(Math.max(CONFIG.spawn.minInterval, CONFIG.spawn.interval * spawnMul())) + "ms</span><br>" +
    "tur " + game.round + " hedef <span>" + game.goal + "</span> · gereken isabet <span>" +
      Math.round(neededAcc() * 100) + "%</span><br>" +
    "run isabet <span>" + Math.round(100 * game.runHits / Math.max(1, game.runShots)) + "%</span> · süre <span>" +
      game.runTime.toFixed(0) + "sn</span>";
}

dbgToggle.addEventListener("click", () => {
  dbgPanel.hidden = !dbgPanel.hidden;
  dbgToggle.textContent = dbgPanel.hidden ? "⚙" : "✕";
  if (!dbgPanel.hidden) { syncSliders(); updateDebugStats(); }
});

/* ========================== telemetri: export / temizle ========================== */
const teleCountEl = document.getElementById("teleCount");
const teleToastEl = document.getElementById("teleToast");
const teleModalEl = document.getElementById("teleModal");
const teleJsonEl = document.getElementById("teleJson");

function updateTeleCount() {
  const n = telemetry.count();
  teleCountEl.textContent = n + (telemetry.saveFailed ? "!" : "");
}

let toastTimer = 0;
function toast(msg, ms) {
  teleToastEl.textContent = msg;
  teleToastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => teleToastEl.classList.remove("show"), ms || 2600);
}

function buildExport() {
  const store = telemetry.load();
  return {
    meta: {
      exportedAt: new Date().toISOString(),
      gameVersion: GAME_VERSION,
      configHash: hashConfig(CONFIG),
      config: JSON.parse(JSON.stringify(CONFIG)),
      device: deviceInfo(),
      runCount: store.runs.length
    },
    runs: store.runs
  };
}

function exportFileName(hash) {
  const d = new Date(), z = n => String(n).padStart(2, "0");
  return "telemetry-" + d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()) +
         "-" + z(d.getHours()) + z(d.getMinutes()) + "-" + hash + ".json";
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* aşağıdaki yedeğe düş */ }
  // iOS Safari yedeği: seçilebilir textarea + execCommand
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;";
  document.body.appendChild(ta);
  let ok = false;
  try {
    const range = document.createRange();
    range.selectNodeContents(ta);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    ta.setSelectionRange(0, text.length);
    ok = document.execCommand("copy");
    sel.removeAllRanges();
  } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

async function downloadJson(text, name) {
  // claude.ai artifact görüntüleyicisi normal tarayıcı indirmesini engelliyor;
  // orada varsa platformun kendi kaydetme yolunu kullan (iPhone'da paylaş sayfası)
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const dl = await window.claude.use("downloads");
      if (dl && typeof dl.save === "function") {
        await dl.save({ filename: name, data: text });
        return "kaydedildi";
      }
    }
  } catch (e) {
    return (e && e.code === "declined") ? "iptal edildi" : "kaydedilemedi";
  }
  try {
    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    return "indiriliyor";
  } catch (e) { return "indirilemedi"; }
}

document.getElementById("teleExport").addEventListener("click", async () => {
  if (telemetry.run) telemetry.endRun("export-sırasında-yarım");   // yarım run da kaydedilsin
  const data = buildExport();
  if (!data.runs.length) { toast("Kayıtlı run yok — önce biraz oyna."); return; }
  const json = JSON.stringify(data);
  const name = exportFileName(data.meta.configHash);
  const copied = await copyText(json);
  updateTeleCount();
  const head = data.runs.length + " run · " + Math.round(json.length / 1024) + " KB\n";
  if (copied) toast(head + "panoya kopyalandı\n" + name, 5000);
  else {
    teleJsonEl.value = json;
    teleModalEl.hidden = false;
    teleJsonEl.focus();
    teleJsonEl.setSelectionRange(0, json.length);
  }
  const saved = await downloadJson(json, name);
  if (copied) toast(head + "panoya kopyalandı · dosya " + saved + "\n" + name, 5000);
});

document.getElementById("teleClear").addEventListener("click", () => {
  const n = telemetry.count();
  if (!n) { toast("Zaten boş."); return; }
  if (!confirm(n + " run silinecek. Emin misin?")) return;
  telemetry.clear();
  updateTeleCount();
  toast(n + " run silindi.");
});

document.getElementById("teleModalClose").addEventListener("click", () => { teleModalEl.hidden = true; });

// sekme kapanırken yarım run kaybolmasın
window.addEventListener("pagehide", () => { if (telemetry.run) telemetry.endRun("abandoned"); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && telemetry.run) telemetry.endRun("abandoned");
});

/* ========================== başlat ========================== */
buildDebugPanel();
updateTeleCount();
resize();
makeClouds();
game.goal = goalFor(1);
game.ammo = CONFIG.ammo.poolSize;
requestAnimationFrame(frame);
</script>
